schema_version = 1
plugin_name = "plink2"

[image]
reference = "ghcr.io/auto-nomics/autonomics/plink2@sha256:998315bf1c34c1c7ef276e93ca6c043dd1982c027c7264325505a9a0adc6d1d2"
tag = "2.0.0-a.6.26"
upstream = "official PLINK 2.0 alpha (plink2) v2.0.0-a.6.26 @ chrchang/plink-ng tag v2.0.0-a.6.26 (commit faed32c9), asset plink2_linux_avx2.zip"
license = "GPL-3.0-only"

[[panels]]
binding = "plink_ref"
mount = "/panels/plink_ref"
bundle = "wjixiang/catalog-plink-ref-1000g-eur-binary"

[[nodes]]
kind = "plink2_clump"
desc = "Runs official PLINK2 --clump against 1000G EUR PLINK binary reference."
doc = """
Runs the official PLINK2 v2.0.0-a.6.26 binary in an ephemeral Podman
container against the offline 1000G EUR Phase3 PLINK reference panel
catalog package `catalog-plink-ref-1000g-eur-binary` (BED/BIM/FAM
triplets per autosome, mounted at /panels/plink_ref). Input is one
tab-separated sumstats File carrying at least an SNP column and a P
column; the wrapper iterates over autosomes 1..=22 by default, or the
single chromosome given in `chr`. The per-chromosome PLINK2 log is
accumulated into one output log, the official `.clumps` tables are
concatenated (each row prefixed with its chromosome number) into the
clumps output, and every chromosome processed is recorded into the
chromosomes output. Each artifact is emitted as an immutable VFS File.
This node is the offline-LD counterpart to the OpenGWAS `/ld/clump`
endpoint used by the native `two_sample_mr` fallback node.
"""
timeout_secs = 1800
artifact_prefix = "/artifacts/plink2_clump"

[nodes.ports]
inputs = [{ type = "file" }]
outputs = [
  { path = "plink2_clump.log", format = "plink2_clump_log" },
  { path = "plink2_clump.clumps", format = "plink2_clumps" },
  { path = "plink2_clump.chromosomes.tsv", format = "plink2_chromosomes" },
]

[nodes.params]
clump_p1 = { type = "number", default = 5e-8, min = 0.0, max = 1.0, doc = "P-value threshold for index SNPs (PLINK2 --clump-p1); defaults to 5e-8, genome-wide significant" }
clump_p2 = { type = "number", default = 1e-6, min = 0.0, max = 1.0, doc = "Secondary p-value threshold for clumped SNPs (PLINK2 --clump-p2); must be >= clump_p1" }
clump_r2 = { type = "number", default = 0.001, min = 0.0, max = 1.0, doc = "Maximum LD r-squared between clumped SNPs (PLINK2 --clump-r2)" }
clump_kb = { type = "int", default = 10000, exclusive_min = 0.0, doc = "Maximum distance in kb for LD clumping (PLINK2 --clump-kb)" }
chr = { type = "int", optional = true, min = 1.0, max = 22.0, doc = "Optional 1-based chromosome to clump (1..=22); omit to iterate over all autosomes" }
input_format = { type = "string", default = "twosamplemr", doc = "Input report layout selecting the PLINK2 column selectors: `twosamplemr` (TwoSampleMR/OpenGWAS tab file with SNP and P columns) or `plink_assoc` (PLINK1-style CHROM/POS/SNP/P report) both map to --clump-id-field SNP --clump-p-field P; `ieu_open_gwas` (OpenGWAS ieu-b variant,pval CSV) maps to --clump-id-field variant --clump-p-field pval" }

[nodes.command]
interpreter = "sh"
script_file = "scripts/clump.sh"

[nodes.command.env]
PLINK2_CLUMP_P1 = "{{ clump_p1 }}"
PLINK2_CLUMP_P2 = "{{ clump_p2 }}"
PLINK2_CLUMP_R2 = "{{ clump_r2 }}"
PLINK2_CLUMP_KB = "{{ clump_kb }}"
PLINK2_CLUMP_CHR = "{{ chr }}"
PLINK2_CLUMP_INPUT_FORMAT = "{{ input_format }}"
